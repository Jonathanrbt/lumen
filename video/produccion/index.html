<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
        font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
      }
      .clip { position: absolute; inset: 0; }

      /* --- Escena 1: hook (0-7s) --- */
      #escena-hook {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 110px;
        text-align: center;
        background: #000;
      }
      .frase-hook {
        position: absolute;
        font-family: Georgia, serif;
        font-size: 108px;
        line-height: 1.25;
        color: oklch(0.95 0.008 260);
        letter-spacing: -0.01em;
      }

      /* --- Escena 2: zona afectada (7-15s) --- */
      #escena-mapa {
        background: oklch(0.17 0.015 260);
      }
      .cuadricula {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(oklch(0.27 0.02 260 / 0.4) 1px, transparent 1px),
          linear-gradient(90deg, oklch(0.27 0.02 260 / 0.4) 1px, transparent 1px);
        background-size: 108px 108px;
      }
      .punto {
        position: absolute;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 22px;
      }
      .anillo { width: 38px; height: 38px; border-radius: 999px; background: oklch(0.74 0.15 264); position: relative; }
      .anillo-eco {
        position: absolute; inset: 0; border-radius: 999px;
        border: 4px solid oklch(0.74 0.15 264 / 0.7);
      }
      .etiqueta { font-size: 42px; font-weight: 600; color: oklch(0.95 0.008 260); white-space: nowrap; }
      .p1 { top: 480px; left: 340px; }
      .p2 { top: 780px; left: 210px; }
      .p3 { top: 1080px; left: 400px; }
      .p4 { top: 1380px; left: 260px; }
      .linea { position: absolute; background: oklch(0.34 0.02 260); width: 4px; }
      .l1 { top: 520px; left: 358px; height: 268px; transform: rotate(-14deg); }
      .l2 { top: 820px; left: 300px; height: 268px; transform: rotate(20deg); }
      .l3 { top: 1120px; left: 340px; height: 268px; transform: rotate(-10deg); }
      .texto-mapa {
        position: absolute;
        left: 90px; right: 90px; bottom: 220px;
        font-size: 66px; line-height: 1.3; font-weight: 600;
        color: oklch(0.95 0.008 260);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="intro"
      data-start="0"
      data-duration="15"
      data-width="1080"
      data-height="1920"
    >
      <section id="escena-hook" class="clip" data-start="0" data-duration="7" data-track-index="0">
        <div id="frase-1" class="frase-hook">Llega la plata para reconstruir.</div>
        <div id="frase-2" class="frase-hook" style="opacity:0">¿Quién está mirando?</div>
      </section>

      <section id="escena-mapa" class="clip" data-start="7" data-duration="8" data-track-index="0">
        <div class="cuadricula"></div>
        <div id="l1" class="linea l1"></div>
        <div id="l2" class="linea l2"></div>
        <div id="l3" class="linea l3"></div>
        <div id="p1" class="punto p1"><div class="anillo"><div id="eco1a" class="anillo-eco"></div><div id="eco1b" class="anillo-eco"></div></div><span class="etiqueta">Cali</span></div>
        <div id="p2" class="punto p2"><div class="anillo"><div id="eco2a" class="anillo-eco"></div><div id="eco2b" class="anillo-eco"></div></div><span class="etiqueta">Buenaventura</span></div>
        <div id="p3" class="punto p3"><div class="anillo"><div id="eco3a" class="anillo-eco"></div><div id="eco3b" class="anillo-eco"></div></div><span class="etiqueta">Valle del Cauca</span></div>
        <div id="p4" class="punto p4"><div class="anillo"><div id="eco4a" class="anillo-eco"></div><div id="eco4b" class="anillo-eco"></div></div><span class="etiqueta">Chocó</span></div>
        <div id="texto-mapa" class="texto-mapa">Los contratos se firman rápido. Sin concurso.</div>
      </section>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // --- Escena 1: hook, tiempos relativos al inicio del root (0s) ---
      tl.fromTo('#frase-1', { autoAlpha: 0, scale: 0.98 }, { autoAlpha: 1, scale: 1, duration: 0.5, ease: 'power2.out' }, 0.1);
      tl.to('#frase-1', { autoAlpha: 1, duration: 2.6 }, 0.6);
      tl.to('#frase-1', { autoAlpha: 0, duration: 0.5 }, 3.2);
      tl.fromTo('#frase-2', { autoAlpha: 0, scale: 0.98 }, { autoAlpha: 1, scale: 1, duration: 0.6, ease: 'power2.out' }, 3.7);
      tl.to('#frase-2', { autoAlpha: 1, duration: 2.7 }, 4.3);

      // --- Escena 2: mapa, tiempos absolutos = 7 + offset dentro de la escena ---
      const M = 7;
      tl.fromTo('#escena-mapa .cuadricula', { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.8, ease: 'power1.out' }, M + 0.1);

      const puntos = [
        ['#p1', '#eco1a', '#eco1b', '#l1', M + 0.9],
        ['#p2', '#eco2a', '#eco2b', '#l2', M + 1.3],
        ['#p3', '#eco3a', '#eco3b', '#l3', M + 1.7],
        ['#p4', null, null, null, M + 2.1],
      ];
      for (const [pid, e1, e2, lid, t] of puntos) {
        tl.fromTo(pid, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.4, ease: 'power1.out' }, t);
        if (lid) tl.fromTo(lid, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.3 }, t + 0.15);
        if (e1) {
          tl.fromTo(e1, { scale: 1, autoAlpha: 0.9 }, { scale: 4.2, autoAlpha: 0, duration: 2.2, ease: 'power1.out', repeat: 2 }, t);
        }
        if (e2) {
          tl.fromTo(e2, { scale: 1, autoAlpha: 0.9 }, { scale: 4.2, autoAlpha: 0, duration: 2.2, ease: 'power1.out', repeat: 2 }, t + 1.1);
        }
      }

      tl.fromTo('#texto-mapa', { autoAlpha: 0, y: 20 }, { autoAlpha: 1, y: 0, duration: 0.6, ease: 'power2.out' }, M + 2.6);
      tl.to('#texto-mapa', { autoAlpha: 1, duration: 4.4 }, M + 3.2);

      window.__timelines['intro'] = tl;
    </script>
  </body>
</html>

<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: oklch(0.17 0.015 260);
        font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
      }
      .clip { position: absolute; inset: 0; }
      #escena {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 56px;
      }
      .marca { display: flex; align-items: center; gap: 34px; }
      .marca img { height: 148px; width: auto; filter: brightness(1.75) saturate(0.9); }
      .marca span {
        font-family: Georgia, serif;
        font-size: 104px;
        color: oklch(0.95 0.008 260);
        line-height: 1;
      }
      .marca sup { font-size: 40px; vertical-align: super; margin-left: 4px; }

      .viabilidad {
        max-width: 860px;
        text-align: center;
        font-size: 42px;
        line-height: 1.45;
        font-weight: 500;
        color: oklch(0.72 0.015 260);
        padding: 0 60px;
      }
      .frase-final {
        font-size: 52px;
        font-weight: 600;
        color: oklch(0.95 0.008 260);
        text-align: center;
        padding: 0 60px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="cierre"
      data-start="0"
      data-duration="5"
      data-width="1080"
      data-height="1920"
    >
      <section id="escena" class="clip" data-start="0" data-duration="5" data-track-index="0">
        <div id="marca" class="marca">
          <img src="assets/lumen-marca.png" alt="" />
          <span>Lumen<sup>©</sup></span>
        </div>
        <div id="viabilidad" class="viabilidad">
          Funciona para cualquier declaratoria de desastre.<br />
          La ventana del sismo dura 12 meses; el problema, siempre.
        </div>
        <div id="frase-final" class="frase-final">No acusamos.<br />Ayudamos a preguntar.</div>
      </section>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.fromTo('#marca', { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: 'power2.out' }, 0.1);
      tl.fromTo('#viabilidad', { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: 'power2.out' }, 0.7);
      tl.fromTo('#frase-final', { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: 'power2.out' }, 1.9);

      window.__timelines['cierre'] = tl;
    </script>
  </body>
</html>

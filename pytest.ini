[pytest]
# El paquete vive en api/, no en la raiz. Esto evita tener que instalar el
# proyecto o pelear con PYTHONPATH.
pythonpath = api
testpaths = api/tests
markers =
    croma: llama a Croma de verdad (necesita CROMA_API_KEY)

# Las pruebas marcadas `croma` salen a la red de verdad: con la llave puesta la
# suite pasaba de 0.2s a 123s y gastaba cuota del token, que es UNO para las
# cuatro personas mas el monitor. Por defecto se deseleccionan; pytest imprime
# cuantas quedaron fuera, asi que nadie confunde "todo pasa" con "todo se probo".
#
#   pytest              -> rapido, sin red
#   pytest -m croma     -> solo las de integracion contra Croma
#   pytest -m ""        -> todo, como antes
addopts = -m "not croma"

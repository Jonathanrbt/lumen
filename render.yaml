# Despliegue del backend en Render. Dueno: Cristian (B3).
#
# Que esto exista desde el principio es deliberado: el brief dejaba el despliegue
# para las 03:30 y eso es un error. Un deploy que se estrena de madrugada es un
# deploy que falla de madrugada. Objetivo: URL viva antes de las 19:00.
#
# Esta listo cuando /health responde DESDE EL CELULAR DE ALGUIEN CON DATOS
# MOVILES, no desde tu navegador con la cache caliente.
#
# Las variables con sync: false NO se ponen aqui: se cargan a mano en el
# dashboard de Render o con el MCP de Render. En este archivo no va ni un secreto.

services:
  - type: web
    name: lumen-api
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: pip install -r api/requirements.txt
    startCommand: uvicorn lumen.main:app --host 0.0.0.0 --port $PORT --app-dir api
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: LUMEN_ENV
        value: produccion
      - key: LUMEN_LOG_LEVEL
        value: info

      # Croma: API HTTP. La URL esta fija en el cliente.
      - key: CROMA_API_KEY
        sync: false

      # Interruptor de creditos. En el servicio desplegado se deja en true
      # (si no, la demo no tiene datos), pero queda declarado aqui para poder
      # apagarlo desde el dashboard sin redesplegar si la cuota se agota.
      - key: LUMEN_CROMA_HABILITADO
        value: "true"

      # IA. Los IDs de modelo los fija Freddy tras correr Cursor.models.list().
      - key: CURSOR_API_KEY
        sync: false
      - key: LUMEN_MODELO_RAPIDO
        sync: false
      - key: LUMEN_MODELO_FUERTE
        sync: false

      # Supabase.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      # Twilio, si sobrevive al hard-cut.
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false

      # Decision 23:20: se queda en "*" y no se espera al dominio de Andrew.
      # Es seguro aqui porque main.py monta CORS con allow_credentials=False:
      # sin cookies ni credenciales cruzadas, "*" solo permite leer lo que ya
      # es publico. Y quita una variable manual del dashboard, que es una cosa
      # menos que puede faltar a las 02:00 durante la integracion.
      # Si algun dia la API acepta credenciales, esto TIENE que volver a ser
      # una lista de dominios explicita.
      - key: LUMEN_CORS_ORIGINS
        value: "*"

      # El enlace que va dentro del mensaje de WhatsApp (no controla CORS).
      # Mismo dominio que LUMEN_CORS_ORIGINS de arriba, sin coma si es solo uno.
      - key: LUMEN_FRONTEND_URL
        sync: false

# --- Keep-alive: el porque de que Render nunca tenga que despertar en frio ---
#
# El plan gratuito apaga el servicio tras 15 minutos sin trafico. La via
# principal es el workflow .github/workflows/keep-alive.yml (cada 10 min, no
# depende de si este plan admite un segundo tipo de servicio). Si en el bloque
# de despliegue se confirma que el plan gratuito soporta un "Cron Job" sin
# friccion de facturacion, esta es la alternativa nativa, en el mismo archivo
# que ya es de Cristian — descomentar y ajustar la URL real del servicio:
#
# - type: cron
#   name: lumen-api-keep-alive
#   runtime: python
#   plan: free
#   region: oregon
#   branch: main
#   schedule: "*/10 * * * *"
#   buildCommand: "true"
#   startCommand: curl --fail --silent --show-error --max-time 20 https://lumen-api.onrender.com/health
